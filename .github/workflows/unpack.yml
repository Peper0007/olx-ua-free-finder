name: Unpack bundle (one-time)
on:
  push:
    paths: ["bundle-ua.zip", ".github/workflows/unpack.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          unzip -o bundle-ua.zip
          git rm -q bundle-ua.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
