name: Free stuff finder UA

on:
  schedule:
    # каждые 20 минут: в :13, :33, :53 (не в :00 — в начале часа GitHub чаще пропускает запуски).
    # Минуты должны совпадать с RUN_MINUTES в main.py и CRON_MINS в dashboard/app.js.
    - cron: "13,33,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что запустить"
        type: choice
        default: run
        options:
          - run        # обычный поиск
          - scheduled  # внешний будильник (cron-job.org): как запуск по расписанию — пауза и ночь учитываются
          - test       # прислать тестовое сообщение в Telegram
          - chat-id    # показать TELEGRAM_CHAT_ID в логе
          - dry-run    # поиск без отправки (результат в логе)

permissions:
  contents: write

concurrency:
  group: finder-ua
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # the newest main, not the commit at trigger time: a run that waited in the queue must see
          # the seen.json saved by the run before it, or it re-sends the same finds
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OLX_PAGES: ${{ vars.OLX_PAGES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MAX_AI_PER_RUN: ${{ vars.MAX_AI_PER_RUN }}
          RUN_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          case "$MODE" in
            run|scheduled) python main.py ;;
            test)    python main.py --test ;;
            chat-id) python main.py --chat-id ;;
            dry-run) python main.py --dry-run ;;
          esac

      - name: Save seen ads
        if: always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == 'scheduled')
        run: |
          git config user.name "finder-bot"
          git config user.email "finder-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen ads"
          git pull --rebase -X theirs origin main || true
          git push
